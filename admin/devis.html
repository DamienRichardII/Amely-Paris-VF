<!doctype html>
<html lang="fr">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/supabase.js"></script>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devis — Amely Paris</title>
  <meta name="robots" content="noindex,nofollow"><link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <style>
    :root{
      --ink:#241914; --muted:#7e6a5f; --line:rgba(36,25,20,.10); --shadow:0 18px 45px rgba(36,25,20,.08);
      --gold:#b78a57; --gold-dark:#8b6235; --new:#7b3f00; --warn:#a36d19; --ok:#2f7d57; --danger:#8a2e2e;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink);
      background:linear-gradient(180deg, #fbf7f2 0%, #f6efe7 100%); min-height:100vh;
    }
    .wrap{width:min(1240px, calc(100% - 28px)); margin:0 auto; padding:22px 0 36px}
    .topbar,.card{
      background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.72); backdrop-filter:blur(14px);
      border-radius:24px; box-shadow:var(--shadow);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; margin-bottom:18px; flex-wrap:wrap;
      position:sticky; top:14px; z-index:10;
    }
    h1{margin:0; font-family:"Cormorant Garamond",Georgia,serif; font-size:44px; font-weight:500; line-height:.95}
    .muted{color:var(--muted)}
    .actions,.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .btn, select, input{
      min-height:46px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit;
    }
    .btn{
      padding:0 16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn-sm{min-height:38px; padding:0 12px; font-size:13px; border-radius:999px}
    .btn-primary{background:linear-gradient(180deg,#c89a63 0%,#a97945 100%); color:#fff; border-color:transparent}
    select,input{padding:0 16px}
    .card{padding:18px}
    .toolbar{display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:16px}
    .export-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
    .checkbox-inline{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); min-height:46px}
    .list{display:grid; gap:12px}
    .row{
      display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.7fr) minmax(0,.7fr) auto auto auto;
      gap:12px; align-items:center; border:1px solid var(--line); border-radius:18px; padding:14px; background:#fffdfb;
    }
    .row.is-urgent{border-color:rgba(138,46,46,.35)}
    .row.is-overdue{background:#fff7f5}
    .main strong{display:block; margin-bottom:4px}
    .main span,.meta{display:block; color:var(--muted); font-size:13px; line-height:1.45; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .badge{
      display:inline-flex; align-items:center; justify-content:center; min-width:110px; padding:10px 12px; border-radius:999px;
      font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center;
    }
    .badge-nouveau{background:rgba(123,63,0,.08); color:var(--new)}
    .badge-a_contacter{background:rgba(163,109,25,.10); color:var(--warn)}
    .badge-contacte{background:rgba(183,138,87,.12); color:var(--gold-dark)}
    .badge-rdv_prevu{background:rgba(183,138,87,.18); color:var(--gold-dark)}
    .badge-devis_envoye{background:rgba(47,125,87,.08); color:#3f7a5c}
    .badge-en_attente_reponse{background:rgba(163,109,25,.10); color:var(--warn)}
    .badge-accepte{background:rgba(47,125,87,.12); color:var(--ok)}
    .badge-refuse{background:rgba(138,46,46,.10); color:var(--danger)}
    .badge-cloture{background:rgba(126,106,95,.10); color:var(--muted)}
    .priority-pill{
      display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:6px 10px; border-radius:999px;
      background:#f1ece3; color:var(--ink);
    }
    .priority-urgente{background:rgba(138,46,46,.12); color:var(--danger); font-weight:700}
    .priority-importante{background:rgba(163,109,25,.12); color:var(--warn); font-weight:700}
    .followup-tag{font-size:11px; color:var(--muted)}
    .followup-tag.overdue{color:var(--danger); font-weight:700}
    .empty{padding:22px; border:1px dashed rgba(36,25,20,.14); border-radius:18px; color:var(--muted)}
    @media (max-width:1080px){
      .row{grid-template-columns:1fr 1fr auto auto}
      .meta.hide-mobile{display:none}
    }
    @media (max-width:760px){
      .wrap{width:min(100% - 16px,100%)}
      .topbar,.card{padding:16px}
      .topbar{position:static}
      .row{grid-template-columns:1fr}
      .badge,.row .btn{width:100%}
      .actions > *,.filters > *{flex:1 1 100%}
      h1{font-size:38px}
    }
    @media print{
      .topbar, .toolbar, .export-bar, .row .btn{display:none !important}
      body{background:#fff}
      .card{box-shadow:none; border:none}
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1>Liste des devis</h1>
        <div class="muted" id="counter">Chargement…</div>
      </div>
      <div class="actions">
        <a class="btn" href="admin.html">Dashboard</a>
        <a class="btn" href="historique.html">Historique</a>
        <a class="btn" href="agenda.html">Agenda</a>
        <a class="btn" href="publications.html">Réalisations</a>
        <a class="btn" href="stats.html">Stats</a>
        <button class="btn btn-primary" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </header>

    <section class="card">
      <div class="toolbar">
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Rechercher un nom, email, lieu, prestation…">
          <select id="statusFilter">
            <option value="all">Tous les statuts</option>
            <option value="nouveau">Nouveau</option>
            <option value="a_contacter">À contacter</option>
            <option value="contacte">Contacté</option>
            <option value="rdv_prevu">Rendez-vous prévu</option>
            <option value="devis_envoye">Devis envoyé</option>
            <option value="en_attente_reponse">En attente de réponse</option>
            <option value="accepte">Accepté</option>
            <option value="refuse">Refusé</option>
            <option value="cloture">Clôturé</option>
          </select>
          <select id="priorityFilter">
            <option value="all">Toutes priorités</option>
            <option value="urgente">Urgente</option>
            <option value="importante">Importante</option>
            <option value="normale">Normale</option>
          </select>
          <label class="checkbox-inline"><input type="checkbox" id="overdueOnly"> Relances dues uniquement</label>
          <label class="checkbox-inline"><input type="checkbox" id="showArchived"> Voir les archivés</label>
        </div>
      </div>

      <div class="export-bar">
        <button class="btn btn-sm" id="exportCsvBtn" type="button">Export CSV</button>
        <button class="btn btn-sm" id="exportXlsxBtn" type="button">Export Excel</button>
        <button class="btn btn-sm" id="exportPdfBtn" type="button">Export PDF (impression)</button>
      </div>

      <div class="list" id="quotesList">
        <div class="empty">Chargement des devis…</div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    (function () {
      const quotesList = document.getElementById('quotesList');
      const counter = document.getElementById('counter');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const priorityFilter = document.getElementById('priorityFilter');
      const overdueOnly = document.getElementById('overdueOnly');
      const showArchived = document.getElementById('showArchived');
      const logoutBtn = document.getElementById('logoutBtn');
      const exportCsvBtn = document.getElementById('exportCsvBtn');
      const exportXlsxBtn = document.getElementById('exportXlsxBtn');
      const exportPdfBtn = document.getElementById('exportPdfBtn');

      let allQuotes = [];
      let currentFiltered = [];

      const STATUS_LABELS = {
        nouveau: 'Nouveau', a_contacter: 'À contacter', contacte: 'Contacté',
        rdv_prevu: 'Rendez-vous prévu', devis_envoye: 'Devis envoyé',
        en_attente_reponse: 'En attente de réponse', accepte: 'Accepté',
        refuse: 'Refusé', cloture: 'Clôturé'
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function badgeClass(status) {
        return 'badge badge-' + (STATUS_LABELS[status] ? status : 'nouveau');
      }
      function labelStatus(status) {
        return STATUS_LABELS[status] || 'Nouveau';
      }

      function isOverdue(item) {
        if (!item.follow_up_date) return false;
        if (['accepte', 'refuse', 'cloture'].indexOf(item.status) !== -1) return false;
        var today = new Date(); today.setHours(0,0,0,0);
        var fu = new Date(item.follow_up_date);
        return fu < today;
      }

      function formatDate(date) {
        if (!date) return 'Date non renseignée';
        const d = new Date(date);
        if (Number.isNaN(d.getTime())) return String(date);
        return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
      }

      function priorityPill(p) {
        var cls = p === 'urgente' ? 'priority-pill priority-urgente' : p === 'importante' ? 'priority-pill priority-importante' : 'priority-pill';
        var label = p === 'urgente' ? 'Urgente' : p === 'importante' ? 'Importante' : 'Normale';
        return '<span class="' + cls + '">' + label + '</span>';
      }

      function renderRows(rows) {
        currentFiltered = rows;
        counter.textContent = rows.length + ' devis affiché' + (rows.length > 1 ? 's' : '');

        if (!rows.length) {
          quotesList.innerHTML = '<div class="empty">Aucun devis ne correspond aux filtres actuels.</div>';
          return;
        }

        quotesList.innerHTML = rows.map(item => {
          const id = encodeURIComponent(item.id);
          const overdue = isOverdue(item);
          const rowClasses = 'row' + (item.priority === 'urgente' ? ' is-urgent' : '') + (overdue ? ' is-overdue' : '');
          return `
            <article class="${rowClasses}">
              <div class="main">
                <strong>${escapeHtml(item.full_name || 'Client')}${item.archived ? ' <span class="muted">(archivé)</span>' : ''}</strong>
                <span>${escapeHtml(item.email || 'Email non renseigné')}</span>
              </div>
              <div class="meta">
                ${(item.event_type ? escapeHtml(item.event_type) : 'Type non renseigné')}<br>
                ${escapeHtml(formatDate(item.created_at))}
              </div>
              <div class="meta hide-mobile">
                ${(item.location ? escapeHtml(item.location) : 'Lieu non renseigné')}<br>
                ${(item.guest_count ? escapeHtml(item.guest_count) + ' personnes' : 'Participants non renseignés')}
              </div>
              ${priorityPill(item.priority || 'normale')}
              <span class="${badgeClass(item.status)}">${labelStatus(item.status)}</span>
              <a class="btn btn-sm" href="id.html?id=${id}">Voir</a>
            </article>
          `;
        }).join('');
      }

      function applyFilters() {
        const q = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        const priority = priorityFilter.value;

        const filtered = allQuotes.filter(item => {
          if (!showArchived.checked && item.archived) return false;
          const haystack = [
            item.full_name, item.email, item.phone, item.event_type, item.location, item.budget, item.message
          ].join(' ').toLowerCase();

          const matchesSearch = !q || haystack.includes(q);
          const matchesStatus = status === 'all' || (item.status || 'nouveau') === status;
          const matchesPriority = priority === 'all' || (item.priority || 'normale') === priority;
          const matchesOverdue = !overdueOnly.checked || isOverdue(item);
          return matchesSearch && matchesStatus && matchesPriority && matchesOverdue;
        });

        renderRows(filtered);
      }

      async function requireSession() {
        if (!window.supabase) {
          quotesList.innerHTML = '<div class="empty">Le client Supabase n\'est pas chargé.</div>';
          return false;
        }
        const { data } = await window.supabase.auth.getSession();
        if (!data.session) {
          window.location.href = 'login.html';
          return false;
        }
        return true;
      }

      async function loadQuotes() {
        const ok = await requireSession();
        if (!ok) return;

        const { data, error } = await window.supabase
          .from('quote_requests')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          quotesList.innerHTML = '<div class="empty">Erreur de chargement : ' + escapeHtml(error.message) + '</div>';
          counter.textContent = '0 devis';
          return;
        }

        allQuotes = Array.isArray(data) ? data : [];
        applyFilters();
      }

      function exportRows() {
        return currentFiltered.map(item => ({
          'Nom': item.full_name || '',
          'Email': item.email || '',
          'Téléphone': item.phone || '',
          'Type de prestation': item.event_type || '',
          'Date événement': item.event_date || '',
          'Nombre de personnes': item.guest_count || '',
          'Lieu': item.location || '',
          'Budget': item.budget || '',
          'Statut': labelStatus(item.status),
          'Priorité': item.priority || 'normale',
          'Date de relance': item.follow_up_date || '',
          'Créé le': item.created_at ? formatDate(item.created_at) : '',
          'Message': item.message || ''
        }));
      }

      function downloadBlob(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      exportCsvBtn.addEventListener('click', function () {
        const rows = exportRows();
        if (!rows.length) { alert('Aucun devis à exporter avec les filtres actuels.'); return; }
        const headers = Object.keys(rows[0]);
        const csvLines = [headers.join(';')].concat(rows.map(r => headers.map(h => '"' + String(r[h]).replace(/"/g, '""') + '"').join(';')));
        downloadBlob('﻿' + csvLines.join('\r\n'), 'devis-amely-paris.csv', 'text/csv;charset=utf-8');
      });

      exportXlsxBtn.addEventListener('click', function () {
        if (!window.XLSX) { alert("La librairie d'export Excel n'a pas pu être chargée."); return; }
        const rows = exportRows();
        if (!rows.length) { alert('Aucun devis à exporter avec les filtres actuels.'); return; }
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Devis');
        XLSX.writeFile(wb, 'devis-amely-paris.xlsx');
      });

      exportPdfBtn.addEventListener('click', function () {
        window.print();
      });

      searchInput.addEventListener('input', applyFilters);
      statusFilter.addEventListener('change', applyFilters);
      priorityFilter.addEventListener('change', applyFilters);
      overdueOnly.addEventListener('change', applyFilters);
      showArchived.addEventListener('change', applyFilters);

      logoutBtn.addEventListener('click', async function () {
        if (!window.supabase) return;
        await window.supabase.auth.signOut();
        window.location.href = 'login.html';
      });

      loadQuotes();
    })();
  </script>
<script src="../assets/js/admin-notifications.js"></script></body>
</html>
